name: INSEF Somno Group-Conformal Regression

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/GROUP_CONFORMAL_REGRESSION_PROTOCOL.md'
      - 'research/insef-2026/run_group_conformal_regression.py'
      - '.github/workflows/insef-somno-group-conformal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn matplotlib
      - name: Run frozen participant-level conformal regression
        run: python research/insef-2026/run_group_conformal_regression.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-group-conformal-regression
          path: research/insef-2026/results_group_conformal_regression/
          if-no-files-found: warn
