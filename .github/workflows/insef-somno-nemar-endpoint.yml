name: INSEF Somno NEMAR Endpoint Validation

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/NEMAR_ENDPOINT_PROTOCOL.md'
      - 'research/insef-2026/run_nemar_endpoint_validation.py'
      - '.github/workflows/insef-somno-nemar-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy
      - name: Run frozen independent endpoint validation
        run: python research/insef-2026/run_nemar_endpoint_validation.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-nemar-endpoint-results
          path: research/insef-2026/results_nemar_endpoint/
          if-no-files-found: warn
