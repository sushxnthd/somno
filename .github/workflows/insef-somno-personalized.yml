name: INSEF Somno Personalized Prefix

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/PERSONALIZED_PREFIX_PROTOCOL.md'
      - 'research/insef-2026/run_personalized_prefix.py'
      - '.github/workflows/insef-somno-personalized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn matplotlib
      - name: Run frozen personalized-prefix evaluation
        run: python research/insef-2026/run_personalized_prefix.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-personalized-prefix-results
          path: research/insef-2026/results_personalized_prefix/
          if-no-files-found: warn
