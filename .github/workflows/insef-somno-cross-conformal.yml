name: INSEF Somno Cross-Conformal Confirmation

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/CROSS_CONFORMAL_PROTOCOL.md'
      - 'research/insef-2026/run_cross_conformal_confirmation.py'
      - '.github/workflows/insef-somno-cross-conformal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn matplotlib
      - name: Run fresh 901-950 paired confirmation
        run: python research/insef-2026/run_cross_conformal_confirmation.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-cross-conformal-confirmation
          path: research/insef-2026/results_cross_conformal/
          if-no-files-found: warn
