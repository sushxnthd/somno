name: INSEF Somno Longitudinal Clearance

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/**'
      - '.github/workflows/insef-somno-sequential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run frozen V4 longitudinal evaluation
        run: python research/insef-2026/run_wakeapp_longitudinal_v4.py
      - name: Upload V4 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-insef-v4-longitudinal-results
          path: research/insef-2026/results_v4/
          if-no-files-found: warn
