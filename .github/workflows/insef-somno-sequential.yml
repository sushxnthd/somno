name: INSEF Somno DROZY Index

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/**'
      - '.github/workflows/insef-somno-sequential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive dependencies
        run: python -m pip install --disable-pip-version-check remotezip requests
      - name: Inspect DROZY archive central directory
        run: python research/insef-2026/inspect_drozy_remote.py
