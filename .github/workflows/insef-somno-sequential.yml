name: INSEF Somno Personal Calibration

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/**'
      - '.github/workflows/insef-somno-sequential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run frozen V5 personal-calibration evaluation
        run: python research/insef-2026/run_wakeapp_personal_calibration_v5.py
      - name: Upload V5 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-insef-v5-personal-calibration-results
          path: research/insef-2026/results_v5/
          if-no-files-found: warn
