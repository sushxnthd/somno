name: INSEF Somno Conformal Robustness

on:
  push:
    branches: [insef-somno-research]
    paths:
      - 'research/insef-2026/CONFORMAL_ROBUSTNESS_PROTOCOL.md'
      - 'research/insef-2026/run_conformal_robustness.py'
      - '.github/workflows/insef-somno-conformal-robustness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn matplotlib
      - name: Run frozen 50-seed robustness continuation
        run: python research/insef-2026/run_conformal_robustness.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somno-conformal-robustness-results
          path: research/insef-2026/results_conformal_robustness/
          if-no-files-found: warn
