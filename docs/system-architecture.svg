<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Somno system architecture</title>
  <desc id="desc">Somno architecture from four smartphone evidence streams through quality control, personal baselines and multimodal fusion to SDI, recovery, Smart Wake and longitudinal feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b14"/>
      <stop offset="1" stop-color="#151224"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#9d90e8"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#777089"/>
    </marker>
    <style>
      .title{font:700 39px Arial,Helvetica,sans-serif;fill:#ffffff}
      .subtitle{font:400 19px Arial,Helvetica,sans-serif;fill:#b8b3ca}
      .section{font:700 16px Arial,Helvetica,sans-serif;letter-spacing:1.3px;fill:#a89cff}
      .boxTitle{font:700 19px Arial,Helvetica,sans-serif;fill:#ffffff}
      .boxText{font:400 15px Arial,Helvetica,sans-serif;fill:#c9c5d8}
      .small{font:400 13px Arial,Helvetica,sans-serif;fill:#9e98af}
      .card{fill:#1d1a2b;stroke:#3b3550;stroke-width:1.5}
      .core{fill:#28213d;stroke:#8b7cff;stroke-width:2}
      .decision{fill:#2b2438;stroke:#d5a45e;stroke-width:1.8}
      .output{fill:#192827;stroke:#62c7ae;stroke-width:1.7}
      .line{fill:none;stroke:#9d90e8;stroke-width:2.2;marker-end:url(#arrowPurple)}
      .bus{fill:none;stroke:#6f6785;stroke-width:1.8}
      .branch{fill:none;stroke:#777089;stroke-width:1.8;marker-end:url(#arrowGray)}
    </style>
  </defs>

  <rect width="1400" height="900" rx="34" fill="url(#bg)"/>

  <text x="70" y="72" class="title">Somno | privacy-first multimodal fatigue and recovery architecture</text>
  <text x="70" y="108" class="subtitle">Evidence-backed measurement families + personal baselines + transparent fusion + actionable outputs</text>

  <text x="70" y="158" class="section">01 · SMARTPHONE EVIDENCE</text>

  <g filter="url(#shadow)">
    <rect class="card" x="70" y="182" rx="18" width="270" height="112"/>
    <text x="94" y="220" class="boxTitle">Reaction time</text>
    <text x="94" y="248" class="boxText">PVT-style response speed</text>
    <text x="94" y="272" class="small">lapses · anticipations · variability</text>

    <rect class="card" x="370" y="182" rx="18" width="270" height="112"/>
    <text x="394" y="220" class="boxTitle">Face &amp; ocular scan</text>
    <text x="394" y="248" class="boxText">On-device ML Kit geometry</text>
    <text x="394" y="272" class="small">closure · EAR · motion · photometry</text>

    <rect class="card" x="670" y="182" rx="18" width="270" height="112"/>
    <text x="694" y="220" class="boxTitle">Subjective sleepiness</text>
    <text x="694" y="248" class="boxText">Karolinska 1 to 9 rating</text>
    <text x="694" y="272" class="small">fast self-report context</text>

    <rect class="card" x="970" y="182" rx="18" width="360" height="112"/>
    <text x="994" y="220" class="boxTitle">Sleep history</text>
    <text x="994" y="248" class="boxText">duration · regularity · recent shortfall</text>
    <text x="994" y="272" class="small">bounded longitudinal sleep-debt model</text>
  </g>

  <path class="bus" d="M205 294 L205 330 M505 294 L505 330 M805 294 L805 330 M1150 294 L1150 330 M205 330 L1150 330"/>
  <path class="line" d="M700 330 L700 372"/>

  <text x="70" y="365" class="section">02 · QUALITY AND PERSONALIZATION</text>

  <g filter="url(#shadow)">
    <rect class="core" x="390" y="386" rx="22" width="620" height="108"/>
    <text x="420" y="423" class="boxTitle">Validity, quality and availability gates</text>
    <text x="420" y="451" class="boxText">camera quality · face presence · motion · signal availability · confidence</text>
    <text x="420" y="475" class="small">each evidence stream is quality-scored before entering the inference layer</text>

    <rect class="core" x="390" y="540" rx="22" width="620" height="120"/>
    <text x="420" y="578" class="boxTitle">Personal-reference inference</text>
    <text x="420" y="606" class="boxText">frozen personal baselines + precision-aware multimodal fusion</text>
    <text x="420" y="632" class="small">PVT 0.40 · Face 0.25 · KSS 0.15 · Sleep debt 0.20 · dynamic renormalization</text>
  </g>

  <path class="line" d="M700 494 L700 540"/>
  <path class="line" d="M700 660 L700 706"/>

  <text x="70" y="700" class="section">03 · STATE, RECOVERY AND ACTION</text>

  <path class="bus" d="M220 720 L1185 720"/>
  <path class="bus" d="M220 720 L220 738 M550 720 L550 738 M870 720 L870 738 M1185 720 L1185 738"/>

  <g filter="url(#shadow)">
    <rect class="decision" x="70" y="742" rx="18" width="300" height="112"/>
    <text x="94" y="780" class="boxTitle">SDI + confidence</text>
    <text x="94" y="808" class="boxText">0 to 100 personal alertness state</text>
    <text x="94" y="832" class="small">signal count · confidence · strongest drivers</text>

    <rect class="decision" x="400" y="742" rx="18" width="300" height="112"/>
    <text x="424" y="780" class="boxTitle">Recovery model</text>
    <text x="424" y="808" class="boxText">debt · circadian · sleep inertia context</text>
    <text x="424" y="832" class="small">semi-Markov recovery-state modelling</text>

    <rect class="output" x="730" y="742" rx="18" width="280" height="112"/>
    <text x="754" y="780" class="boxTitle">Smart Wake</text>
    <text x="754" y="808" class="boxText">native Android alarm loop</text>
    <text x="754" y="832" class="small">exact alarm · check-in · adaptive snooze</text>

    <rect class="output" x="1040" y="742" rx="18" width="290" height="112"/>
    <text x="1064" y="780" class="boxTitle">Longitudinal feedback</text>
    <text x="1064" y="808" class="boxText">trends · insights · local-first sync</text>
    <text x="1064" y="832" class="small">privacy-preserving derived features</text>
  </g>

  <path class="branch" d="M220 720 L220 742"/>
  <path class="branch" d="M550 720 L550 742"/>
  <path class="branch" d="M870 720 L870 742"/>
  <path class="branch" d="M1185 720 L1185 742"/>
</svg>
